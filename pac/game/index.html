<!--
  PAC — v0.8.0 (Claude, 2026-10-21) — files: index.html (layout + styles), look.js (ink look + model loader),
  js/core.js, js/world.js, js/actors.js, js/abilities.js, js/ui.js, js/intro.js, js/main.js, assets/*.glb (Blender), vendor/ (three r128).
  CHANGELOG v0.8.0 — from Brent's v0.7 feedback (2026-10-21 02:05-02:09) and his "Build" (07:50):
   + Pac is now an ORIGINAL character (Brent's brief): slender, tattooed, rough-edged, quick-witted ghost killer — platinum slick-back,
     scar, taped nose, stubble, mustard vest, ink sleeves; his jaw UNHINGES when he eats. (models/blender/pac.py)
   + 3 active buttons (L-click / R-click / E · phone A / B / C) + 3 passives + movement (Space · phone swipe on the right side).
     A run holds 6 abilities; once a side is full, new ones only come as swaps that wipe that slot's upgrades.
   + Faster levelling. After the set picks (L2 passive, L3 + L4 actives) every level is a random mix: new abilities, upgrades,
     stats, perks (Extra Pellet, Leech, Overkill, Thick Skin), swaps — never three of a kind.
   + Dark, Pac-themed ability names (Number Twos, Pellet Puke, Shank Hands, Life Insurance, Rage Quit, Dead Drop, Power Pellet Binge,
     Unhinged, Toxic Glitter, Repo Ghosts, Fruit Salad Massacre, Cold Turkey, Ghost Ex-Wife, Get Off My Lawn...). More homing options
     (Pellet Habit, Repo Ghosts, Fruit Salad Massacre) and aim-assist on cones (Unhinged, Pellet Puke, Not On The List).
   + Every ability is one of the 7 colours (fire, toxic, frost, void, shock, nature, shadow) with its own effects and cast sound.
   + Level-up window: slow-mo, flash, confetti, jackpot sound, cards slam in glowing in their colour, the pick bursts in its colour.
   + Ball Boy's team is four ORIGINAL creatures, one per element: Cindercub (fire), Splashpup (water), Voltmoth (shock),
     Bramblebud (plant) — each yells, shows its name, and warns before it hits. You must face 3 before he can go down.
   + Ghosts improved (same model): rippling hems, edges glowing in their colour, wisps, ectoplasm puddles, frozen look.
   + The club is packed: more dancers, bouncers on the doors, bartenders, a DJ, podium dancers, a band; tables with stools.
   + Hallways and terrain: an entrance hallway, lounges behind low walls, an island bar and a side bar, a VIP hallway, backstage lanes.
   + More heals (3 fruit per room, ghosts drop fruit, heals in the boss room) and random power-ups (rage, speed, magnet, rapid fire,
     shield, double XP). The boss room is cleared of dots, coins and crowd for the fight.
   + Blue-orb lag fixed: the full-screen CSS invert is replaced by a cheap shader pass. Wall checks bucketed for speed.
   + The intro is told with the game's 3D models (original villains: the Emperor, Baron Kaboom, the Quarter Moon, the Q-Wing,
     the chrome assassin), beat for beat from INTRO.md, ~97 s, with comic captions and bubbles on top. Our own whistle tune.
   - Removed: the old ball-shaped Pac, the MOVE button (now a swipe), micro-passive slots (folded into the 3 passives),
     Gloomoth and Boulderbud (became Voltmoth and Bramblebud).
  CHANGELOG v0.7.0 — from Brent's v0.6 feedback (2026-10-21 00:32) and his "Go":
   + Real modelled characters (Blender, scripted): Pac (cap, gloves, sneakers, hinged jaw), Ball Boy, clubgoers (raver, dancer,
     bouncer, bro — people, not legs), ghosts with a wavy hem, Ball Boy's three creatures, club furniture. Inked look + neon glow (bloom).
   + Lighting: moving spotlights, beams, lasers, disco balls, light pools; techno per scene (menu / club / boss); new SFX + reverb.
   + Phone: the game fills the screen. Small see-through controls on top: a stick wherever your left thumb lands, A / B / MOVE
     clustered under the right thumb. Abilities auto-aim at the most dangerous thing in front of you.
   + Top of screen: one short objective line, score in the middle (tap for details), lessons one at a time at the bottom.
   + Ability names redone as puns (Dookie Drop, Spit Take, Prickly Pac, Love Glove, Big Bang, Belly Flop, Big Balls, Gobsmacker,
     Fairy Farts...). Micro passives from level 5 (Waka Wheel, Pellet Gun...); from level 7, every other level can offer
     a new ability that REPLACES one you have.
   + Slower: lower move speeds, a steeper XP curve (no more instant level 12), smaller ghost packs that grow with your level.
   + Ghosts have temperaments (Chaser lunges, Ambusher cuts you off, Flanker circles, Wildcard scatters) and come in packs.
   + Dots: still "highway" trails lead you room to room; only a few set pieces in each room move. Rooms fill as you approach.
   + Boss SHOWDOWN: the game takes the camera, spotlights Ball Boy and his three creatures, then you, then hands you the fight.
     No hit can take more than 22% of your health; a pick at level-up gives a moment of grace.
   + Cone attacks aim where you point (mouse) or at the nearest threat (phone); buttons show real cooldowns.
   + Mario-style fire bars guarding coins and fruit; fruit heals; coins carry out of the run.
   + Intro rebuilt beat for beat from INTRO.md as inked comic panels (~97 s), narrator cut off mid-word, whistle before the portal.
   - Removed: the Game Boy pad that shrank the screen; the progress rail; text piled at the top of the screen.
  Canon notes: ability, creature and room names are drafts until Brent rules. Ball Boy and his creatures are our own designs.
-->

.card{width:240px;padding:14px;cursor:pointer;text-align:left;border:1px solid #6d5734;background:linear-gradient(180deg,#221c24,#0e0b10);transition:transform .12s,border-color .12s;border-radius:4px}
.card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.card.sel{border-color:var(--gold2);box-shadow:0 0 16px rgba(246,220,149,.3)}
.card.lock{opacity:.4;cursor:not-allowed}
.card .k{font-size:11px;letter-spacing:.16em;color:var(--dim);font-family:Cinzel}
.card .n{font-family:Cinzel;font-size:19px;font-weight:700;margin:4px 0;color:var(--gold2)}
.card .d{font-size:14px;line-height:1.35;color:#d6cfbf}
.card .ic{font-size:30px;float:right;margin-left:8px}
.card.offer{position:relative;border-color:var(--el);box-shadow:0 0 0 1px #000,0 0 22px color-mix(in srgb, var(--el) 45%, transparent),inset 0 0 30px color-mix(in srgb, var(--el) 18%, transparent);animation:slam .42s cubic-bezier(.2,1.6,.4,1) both}
.card.offer .n{color:#fff;text-shadow:0 0 12px var(--el)}
.card.offer .badge{position:absolute;top:-10px;left:12px;font-family:Cinzel;font-weight:900;font-size:11px;letter-spacing:.12em;padding:2px 8px;border-radius:3px;background:var(--el);color:#0b0910;box-shadow:0 0 12px var(--el)}
.card.offer .chip{position:absolute;top:-10px;right:12px;font-family:Cinzel;font-size:9.5px;letter-spacing:.18em;padding:2px 7px;border-radius:3px;border:1px solid var(--el);color:var(--el);background:#0b0910}
.card.offer:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 0 1px #000,0 0 34px var(--el)}
.card.offer.chosen{animation:chosen .3s ease-out forwards}.card.offer.gone{animation:gone .25s ease-in forwards}
@keyframes slam{0%{opacity:0;transform:scale(1.7) rotate(-6deg)}60%{opacity:1;transform:scale(.94) rotate(1deg)}100%{transform:none}}
@keyframes chosen{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 60px var(--el)}100%{transform:scale(1.3);opacity:0}}
@keyframes gone{to{opacity:0;transform:scale(.8) translateY(20px)}}
.reel.stop{border-color:#ffe14d;box-shadow:inset 0 0 18px #000,0 0 16px rgba(255,225,77,.6)}
#jack .win{border-color:#8c7144;box-shadow:0 0 60px rgba(255,180,40,.25),inset 0 0 0 1px #000}
.r-common{color:#d8d2c2!important}.r-rare{color:#5aa8ff!important}.r-mythic{color:#ffb627!important}.r-move{color:#7cff8a!important}.r-micro{color:#c08aff!important}.r-stat{color:#9ad0c8!important}
#jack .reels{display:flex;gap:10px;justify-content:center;margin:12px 0 16px}
.reel{width:72px;height:72px;border:2px solid #8c7144;background:radial-gradient(#1a1418,#060407);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:inset 0 0 18px #000;border-radius:4px;font-family:Cinzel;font-weight:900;color:#ffd23f}
/* character sheet (pause + loadout): the window on the left shows the live 3D character */
.sheet{display:flex;gap:16px;width:min(1000px,96%);height:min(620px,94%)}
.doll{position:relative;flex:0 0 46%;border:1px solid #6d5734;box-shadow:0 0 0 9999px rgba(0,0,0,.78),inset 0 0 40px rgba(0,0,0,.8);border-radius:4px}
#dollT{position:absolute;top:8px;left:0;right:0;text-align:center;text-shadow:0 0 6px #000}
.gslot{position:absolute;width:58px;height:58px;border:1px solid #6d5734;background:rgba(10,8,12,.82);font-size:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);font-weight:700;line-height:1.1;padding:2px;border-radius:3px}
.gslot.has{color:var(--gold2);border-color:var(--gold)}
.gslot.epic{border-color:#ffb627;box-shadow:0 0 12px rgba(255,182,39,.5);color:#ffb627}
.gslot.quality{border-color:#9ab0d0;color:#cfe0ff}
.side{flex:1;display:flex;flex-direction:column;padding:16px 18px;min-width:0;position:relative;z-index:1}
.tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.tabs .btn{padding:7px 12px;font-size:13px}
.pane{flex:1;overflow:auto;font-size:15px;line-height:1.5;padding-right:4px}
.pane table,#subWin table{border-collapse:collapse}
.pane table{width:100%}
.pane td{padding:6px 4px;border-bottom:1px solid rgba(140,113,68,.25);vertical-align:top}
.pane td:first-child{color:var(--gold);font-family:Cinzel;font-size:13px;white-space:nowrap;width:1%;padding-right:14px}
.foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pm{width:26px;height:24px;padding:0;font-size:15px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg .btn{padding:5px 10px;font-size:12px}
input[type=range]{width:180px;accent-color:#d8b46a}
#tally .rows div{display:flex;justify-content:space-between;gap:30px;font-size:17px;line-height:1.8;border-bottom:1px solid rgba(140,113,68,.2)}
#tally .rows b{font-variant-numeric:tabular-nums;color:var(--gold2)}
#stars{font-size:46px;letter-spacing:6px;margin:10px 0;text-align:center;color:#3a3226}
#stars .on{color:#ffd23f;text-shadow:0 0 16px #ffb000}
#unlockCard{margin:12px auto;padding:12px;border:1px solid var(--gold);text-align:center;box-shadow:0 0 22px rgba(246,220,149,.3);border-radius:4px}
#introC{position:absolute;inset:0;width:100%;height:100%;z-index:30;background:transparent;cursor:pointer}
#skip{position:absolute;right:16px;bottom:12px;z-index:31;color:#998;font-size:13px;font-family:Cinzel;letter-spacing:.1em;pointer-events:none}

body.mobile #mainMenu{background:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.2) 28%,rgba(0,0,0,.2) 45%,rgba(0,0,0,.88) 72%)}
body.mobile #mmLeft{left:5%;right:5%;width:auto;top:3%;bottom:3%;gap:6px}

#mmBtns{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.card{width:100%}.sheet{flex-direction:column;height:96%}.doll{flex:0 0 40%}.gslot{width:42px;height:42px;font-size:8px}
  .win{padding:16px 14px;max-width:96%}.win h2{font-size:20px}
