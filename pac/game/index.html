<!--
  PAC — v0.6.0 (Claude, 2026-10-20)
  CHANGELOG v0.6.0 (full rebuild of game/index.html, all lines) — from Brent's rulings 2026-10-20 22:38–23:01:
   + Main menu: New Game, Character Select (unlocked only), Loadout, Endless, PvP (bots), Settings, Intro, Quit
   + World 1 is a long nightclub LANE you travel up; dot patterns MOVE (spin, sway, chase, flow, spiral) and lead you on
   + Controls: WASD/stick move, mouse aims, LEFT = offensive ability, RIGHT = defensive, SPACE = movement; passive is automatic
   + Phone: big screen on top, Game Boy style controls below (stick, A = offense, B = defense, WARP, START, SELECT)
   + Run ladder: L1 movement, L2 pick 1 of 3 passive Commons (Poop Bomb / Waka Spray / Spike Out),
     L3 pick 1 of 3 defensive Rares (Pac Shield / Waka Pulse / Belly Hop), L4 pick 1 of 3 offensive Mythics
     (Pac Ball / Mega Chomp / Sugar Rush), L5–25 fast micro upgrades (ranks, micro passives, stats)
   + Mini boss BALL BOY: sends out 3 creatures (Cindercub fire, Boulderbud push-back, Gloomoth sleep powder); he can't
     die until you've faced 3 creature moves. On his death everything good vacuums into you, lottery tally, 1–5 stars,
     Ball Boy unlocks as a playable character (starts with the same 3 creatures; no loadout)
   + Character levels 1–100 outside the game (unlock talents, abilities to buy, cosmetics later); run levels cap at 25
   + Difficulty (Easy/Normal/Hard) and game speed (0.75×–1.5×) with score multipliers
   + D2-style dark UI with neon accents: health/energy globes, skill bar, score top-middle (hover/click for details),
     objective arrow, lane progress; character-sheet pause screen with live close-up and gear slots
   - Removed: towers in world 1, levels 5–6 ladder, locked Pac versions on the start screen
  Canon notes: abilities/creature names are drafts until Brent rules. Ball Boy and his creatures are our own designs.
-->
<style>

const charNeed = l => 150 + l*50;    // character XP (outside the game) needed for the next level, 1..100

// =====================================================================================================

const fadeScene = new THREE.Scene(), fadeCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const LIGHT_DIR = new THREE.Vector3(-0.4, 1, 0.45).normalize();

// =====================================================================================================
// 2. INK HATCH LOOK — characters + gear: muted, matte, sketched, never filled solid. uGloss = better gear shine, uEmit = epic glow
// =====================================================================================================
const hatchU = {uTime:{value:0}, uLight:{value:LIGHT_DIR}};
const HATCH_VS = `varying vec3 vN; varying vec3 vW; varying vec3 vC;
  void main(){ vec4 p = vec4(position,1.0); vec3 n = normal;
    #ifdef USE_INSTANCING

const HATCH_FS = `uniform vec3 uTint; uniform vec3 uInk; uniform vec3 uLight; uniform float uTime; uniform float uGloss; uniform vec3 uEmit; uniform float uDensity; uniform float uFlash;
  varying vec3 vN; varying vec3 vW; varying vec3 vC;
  float h(float n){ return fract(sin(n)*43758.5453); }
  float strokes(vec2 p, float ang, float gap, float seed){ vec2 d = vec2(cos(ang), sin(ang)), q = vec2(-d.y, d.x);
    float t = dot(p,d) + sin(dot(p,q)*0.045 + seed*7.0)*2.2 + sin(dot(p,q)*0.17 + seed)*0.7;
    float f = abs(fract(t/gap) - 0.5)*gap; float br = step(0.18, h(floor(dot(p,q)/9.0) + floor(t/gap)*3.1 + seed));
    return (1.0 - smoothstep(0.55, 1.35, f))*br; }

    vec3 V = normalize(cameraPosition - vW); float rim = pow(1.0 - clamp(dot(n,V),0.0,1.0), 2.0);
    float tone = ndl*0.75 + 0.25 - rim*0.25; float s8 = floor(uTime*8.0);
    vec2 p = gl_FragCoord.xy + vec2(h(s8)*3.0, h(s8+1.7)*3.0); float g = 3.6*uDensity, ink = 0.0;
    if(tone < 0.86) ink = max(ink, strokes(p, 0.78, g, 1.0+s8*0.13));

    if(tone < 0.42) ink = max(ink, strokes(p, 0.10, g*0.9, 3.0+s8*0.07));
    if(tone < 0.24) ink = max(ink, strokes(p, 1.45, g*0.8, 4.0+s8*0.05));
    vec3 col = mix(uTint*vC*(0.74 + 0.4*tone), uInk, ink*0.82);
    vec3 H = normalize(normalize(uLight) + V);
    col += vec3(1.0)*pow(clamp(dot(n,H),0.0,1.0), 36.0)*uGloss*1.2 + rim*uGloss*0.35 + uEmit*(0.6+0.4*rim) + vec3(uFlash);
    gl_FragColor = vec4(col, 1.0); }`;
function hatchMat(tint, o={}){ return new THREE.ShaderMaterial({uniforms:Object.assign({uTint:{value:new THREE.Color(tint)}, uInk:{value:new THREE.Color(o.ink||0x14110e)},
  uGloss:{value:o.gloss||0}, uEmit:{value:new THREE.Color(o.emit||0)}, uDensity:{value:o.density||1}, uFlash:{value:0}}, hatchU), vertexShader:HATCH_VS, fragmentShader:HATCH_FS}); }
const OUT_VS = `uniform float uTime; uniform float uW; float h(float n){ return fract(sin(n)*43758.5453); }
  void main(){ vec3 p = position; vec3 n = normal;
    #ifdef USE_INSTANCING
      p = (instanceMatrix * vec4(p,1.0)).xyz; n = mat3(instanceMatrix) * n;
    #endif
    float s = floor(uTime*8.0); float j = 0.7 + 0.6*h(dot(position, vec3(12.9,78.2,37.7)) + s);
    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(p + normalize(n)*uW*j, 1.0); }`;

  fragmentShader:`void main(){ gl_FragColor = vec4(0.047,0.04,0.031,1.0); }`, side:THREE.BackSide}); }
function inked(geo, mat, w=0.035){ const g = new THREE.Group(); g.add(new THREE.Mesh(geo, outlineMat(w)), new THREE.Mesh(geo, mat)); return g; }
const glowTex = (()=>{ const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.25,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)');

function floorTexture(seed){
  const N = 1024, P = 128, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d');
  let r = seed; const rr = ()=>{ r = (r*16807)%2147483647; return r/2147483647; };

    x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(px+2,py+P-4,P-4,2); x.fillRect(px+P-4,py+2,2,P-4);

  x.fillStyle = '#040308'; for(let i=0;i<=N;i+=P){ x.fillRect(i-1,0,3,N); x.fillRect(0,i-1,N,3); }
  x.strokeStyle = 'rgba(0,0,0,0.8)'; x.lineWidth = 1.3;
  for(let k=0;k<18;k++){ let cx = rr()*N, cy = rr()*N; x.beginPath(); x.moveTo(cx,cy); for(let j=0;j<7;j++){ cx += (rr()-.5)*40; cy += (rr()-.5)*40; x.lineTo(cx,cy); } x.stroke(); }

}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(44, 400), new THREE.MeshStandardMaterial({color:0xa49cc8, map:floorTex, bumpMap:floorTex, bumpScale:0.6, roughness:0.32, metalness:0.25}));

const WALLS = [];   // AABBs {x0,x1,z0,z1,solid}
const wallMat = new THREE.MeshStandardMaterial({color:0x14101e, roughness:0.45, metalness:0.4});
function neonStrip(x0,z0,x1,z1,y,color,w=0.1,glows=true){

}

{ const d = new THREE.Object3D(); let i = 0; for(let a=0;a<TX;a++) for(let b=0;b<TZ;b++){ d.position.set(-22+TILE/2+a*TILE, 0.03, -TILE/2-b*TILE); d.rotation.set(-Math.PI/2,0,0); d.updateMatrix(); tiles.setMatrixAt(i++, d.matrix); } }

function buildRig(p){
  const rig = {root:new THREE.Group(), bones:{}, anchors:{}, p}; const B = rig.bones;
  B.hips = new THREE.Group(); B.hips.position.y = p.legLen; rig.root.add(B.hips);
  B.body = new THREE.Group(); B.body.position.y = p.bodyY; B.hips.add(B.body);
  B.head = new THREE.Group(); B.head.position.y = p.headY; B.body.add(B.head);
  for(const s of [-1,1]){ const k = s<0?'L':'R';
    const leg = new THREE.Group(); leg.position.set(s*p.hipW,0,0); B.hips.add(leg); B['leg'+k] = leg;
    const foot = new THREE.Group(); foot.position.y = -p.legLen; leg.add(foot); B['foot'+k] = foot;
    const arm = new THREE.Group(); arm.position.set(s*p.shW, p.shY, 0); B.body.add(arm); B['arm'+k] = arm;
    const hand = new THREE.Group(); hand.position.y = -p.armLen; arm.add(hand); B['hand'+k] = hand; }
  Object.assign(rig.anchors, {headpiece:B.head, chest:B.body, gloveL:B.handL, gloveR:B.handR, weaponR:B.handR, bootL:B.footL, bootR:B.footR});
  return rig;
}

let PATS = [];
const PATFN = {
  spin:   (P,u,t)=>{ const a = u*6.283 + t*P.w; return [P.cx+Math.cos(a)*P.r, P.cz+Math.sin(a)*P.r]; },

function useActive(h, slot){

  if(k==='shield'){ h.shieldT = A.dur; h.shieldHP = A.absorb*(1+0.25*(h.rank[k]||0)); h.absorbed = 0; tone(520, 0.3, 'sine', 0.07, 1.5); }
  else if(k==='pulse'){ const R = areaOf(h,k,A.rad); areaHit(h, h.x, h.z, R, dmgOf(h,k,A.dmg), {knock:A.knock}); ringFx(h.x, h.z, R, A.col, 0.4); ringFx(h.x, h.z, R*0.6, 0xffffff, 0.3); addShake(0.25); tone(110, 0.2, 'sine', 0.12, 0.5); }

  else if(k==='pacball'){ h.ballT = A.dur*(1+0.1*(h.rank[k]||0)); heroSay(h, 'level'); tone(90, 0.8, 'sawtooth', 0.1, 2); addShake(0.3); }

function useMove(h){

// 12. THE BOSS — BALL BOY: keeps his distance, throws empty balls, sends out Cindercub → Boulderbud → Gloomoth in turn.
//     He can't go down until you've faced 3 creature moves.
// =====================================================================================================
let BOSS = null;
const SHOTS = [];
function makeBoss(){ const rig = makeBallBoy({jacket:0x5a2e3a, cap:0xc0402a}); scene.add(rig.root); const D = diff();
  BOSS = {kind:'boss', x:0, z:-335, r:1.2, hp:1400*D.hp, maxhp:1400*D.hp, rig, awake:false, alive:true, dead:false, faced:0, seq:0, throwT:2.5, ballT:2, spawnT:9, face:0, walk:0, hitT:0, throwPose:0}; }
function bossDamage(d, h){ if(!BOSS || !BOSS.alive) return; BOSS.hp -= d; BOSS.hitT = 0.08;
  if(BOSS.faced < 3 && BOSS.hp < BOSS.maxhp*0.08){ BOSS.hp = BOSS.maxhp*0.08; if(!BOSS.noDieSaid){ BOSS.noDieSaid = true; say('boss','noDie',true); } }
  if(BOSS.hp <= 0) bossDie(); }
function updateBoss(dt){
  if(!BOSS || !BOSS.alive) return; const P0 = player(), d = hyp(P0.x-BOSS.x, P0.z-BOSS.z);
  if(!BOSS.awake && P0.z < -294){ BOSS.awake = true; $('bossBar').classList.remove('hide'); say('boss','intro',true); big('BALL BOY', 1300); toast('bossT','Ball Boy sends out three creatures. Dodge the red warnings. He can only be beaten after you have faced all three.'); }
  if(BOSS.awake && !P0.dead){
    const want = 9, dx = P0.x-BOSS.x, dz = P0.z-BOSS.z, s = d > want+2 ? 1 : d < want-2 ? -1 : 0;
    const mx = dx/(d||1)*s + (-dz/(d||1))*0.6*Math.sin(gt*0.7), mz = dz/(d||1)*s + (dx/(d||1))*0.6*Math.sin(gt*0.7);
    const nx = BOSS.x + mx*5*dt, nz = BOSS.z + mz*5*dt; if(!blocked(nx, BOSS.z, 1) && Math.abs(nx) < 19) BOSS.x = nx; if(!blocked(BOSS.x, nz, 1) && nz < -296 && nz > -348) BOSS.z = nz;
    BOSS.walk += hyp(mx,mz)*dt*8; BOSS.face = Math.atan2(dx, dz); BOSS.moving = hyp(mx,mz) > 0.2;
    BOSS.throwT -= dt; if(BOSS.throwT <= 0 && !CRE.some(c=>c.isBoss)){ BOSS.throwT = 3.2; const type = ['cindercub','boulderbud','gloomoth'][BOSS.seq%3]; BOSS.seq++;
      say('boss', type==='cindercub'?'cub':type==='boulderbud'?'bud':'moth', true);
      if(type==='cindercub'){ const a = Math.atan2(BOSS.x-P0.x, BOSS.z-P0.z); throwCreature(BOSS, type, P0.x+Math.sin(a)*4.5, P0.z+Math.cos(a)*4.5, true); }
      else throwCreature(BOSS, type, P0.x + P0.vx*0.3, P0.z + P0.vz*0.3, true); }
    BOSS.ballT -= dt; if(BOSS.ballT <= 0){ BOSS.ballT = 1.5; const m = makeBall(); m.position.set(BOSS.x, 2.4, BOSS.z); scene.add(m); const a = Math.atan2(P0.x-BOSS.x, P0.z-BOSS.z); SHOTS.push({m, vx:Math.sin(a)*15, vz:Math.cos(a)*15, life:2.2, dmg:9}); BOSS.throwPose = 0.3; }
    BOSS.spawnT -= dt; if(BOSS.spawnT <= 0){ BOSS.spawnT = 10; for(let i=0;i<4;i++) spawnGhost(pick(['red','green','blue']), false, [BOSS.x+Math.cos(i*1.6)*4, BOSS.z+Math.sin(i*1.6)*4]); }
  }
  $('bossHp').style.width = Math.max(0, BOSS.hp/BOSS.maxhp*100)+'%';

  else if(o.kind==='micro'){ const A = ABIL[o.k], lv = (h.micro[o.k]||0)+1; k = lv===1?'NEW MICRO PASSIVE':'MICRO PASSIVE · level '+lv; n = A.name; d = A.d; ic = A.ic; cls = 'r-micro'; }
  else { const S = STATUP[o.k]; k = 'STAT'; n = S.n; d = 'A permanent boost for this run.'; ic = S.ic; cls = 'r-stat'; }
  return `<div class="card" data-i="${i}"><div class="ic">${ic}</div><div class="k ${cls}">${k}</div><div class="n">${n}</div><div class="d">${d}</div><div class="k" style="margin-top:8px">${isMobile?'tap':'press '+(i+1)}</div></div>`;
}
function openJack(){
  if(!pendingLv.length){ state = 'play'; return; } const lv = pendingLv[0], h = player(); state = 'jack'; $('jack').classList.remove('hide'); mouseDown[0] = mouseDown[2] = false;
  const offers = offersFor(h); jackOffers = null; $('offers').innerHTML = '';
  $('jackT').textContent = 'LEVEL '+lv; $('jackS').textContent = !h.moveOk ? 'Your movement ability' : !h.slots.passive ? 'Choose a passive Common. It fights for you automatically.' : !h.slots.def ? 'Choose a defensive Rare' : !h.slots.off ? 'Choose an offensive Mythic' : 'Pick an upgrade';
  const syms = ['🍒','👻','⭐','💎','7','🔵','🍕'], reels = [$('r0'),$('r1'),$('r2')]; const stopAt = SAVE.set.fastReels || lv > 4 ? [0.15,0.25,0.35] : [0.6,0.95,1.3]; const t0 = performance.now(); let skip = false;
  clearInterval(reelTimer);
  reelTimer = setInterval(()=>{ const el = skip ? 9 : (performance.now()-t0)/1000; reels.forEach((r,i)=>{ if(el < stopAt[i]) r.textContent = pick(syms); else { const o = offers[Math.min(i, offers.length-1)]; r.textContent = o.kind==='move'?MOVES[CHARS[h.char].move].ic : o.kind==='stat'?STATUP[o.k].ic : ABIL[o.k].ic; } });
    if(el >= stopAt[2]){ clearInterval(reelTimer); jackOffers = offers; $('offers').innerHTML = offers.map((o,i)=>offerHtml(o,h,i)).join(''); $('offers').querySelectorAll('.card').forEach(c=>c.onclick = ()=>chooseOffer(offers[+c.dataset.i])); tone(1320,0.2,'square',0.05); }
    else tone(500+Math.random()*400, 0.02, 'square', 0.02); }, 50);
  $('spd').onclick = ()=>{ skip = true; };
}
function chooseOffer(o){ if(!jackOffers || !o) return; jackOffers = null; applyChoice(player(), o); pendingLv.shift(); $('jack').classList.add('hide'); state = 'play'; if(pendingLv.length) setTimeout(openJack, 250); }

const GEAR_SLOTS = [['Headpiece',50,8],['Neck',80,16],['Chest',86,36],['Weapon 1',10,40],['Weapon 2',90,56],['Gloves',10,62],['Ring 1',84,74],['Ring 2',68,90],['Legs',18,84],['Boots',40,92],['Banner',18,16]];

    if(sheetTab==='stats') h = `<table><tr><td>Run level</td><td>${P0.level} / 25</td></tr><tr><td>Health</td><td>${Math.round(P0.hp)} / ${P0.maxhp}</td></tr><tr><td>Energy</td><td>${Math.round(P0.energy)} / ${P0.maxEnergy}</td></tr>

    dummy.position.set(g.x, Math.sin(g.bob)*0.12*g.scale, g.z); dummy.rotation.set(0, Math.atan2(tx-g.x, tz-g.z) + (blueT>0&&!g.big?Math.PI:0), g.stunT>0?0.3:0); dummy.scale.set(s,s,s); dummy.updateMatrix();
    ghostM.setMatrixAt(i, dummy.matrix); ghostO.setMatrixAt(i, dummy.matrix);
    if(g.hitT>0) tmpC.setHex(0xffffff); else if(blueT>0 && !g.big) tmpC.setHex(blueT<2 && Math.floor(rt*8)%2 ? 0xffffff : 0x2a4aff); else tmpC.setHex(GHOST_TYPES[g.type].col);
    if(g.stunT > 0) tmpC.lerp(STUN_COL, 0.5); ghostM.setColorAt(i, tmpC);
    const m = dummy.matrix.clone(); for(const e of [-1,1]){ tmpV.set(e*0.22, 1.15, 0.52).applyMatrix4(m); dummy.position.copy(tmpV); dummy.rotation.set(0,0,0); dummy.scale.set(g.scale, g.scale*1.3, g.scale*0.6); dummy.updateMatrix(); eyesM.setMatrixAt(i*2+(e>0?1:0), dummy.matrix); } }
  ghostM.instanceMatrix.needsUpdate = ghostO.instanceMatrix.needsUpdate = eyesM.instanceMatrix.needsUpdate = true; ghostM.instanceColor.needsUpdate = true;
  // ---- gems ----
  gemMesh.count = Math.min(800, GEMS.length); for(let i=0;i<gemMesh.count;i++){ const g = GEMS[i]; dummy.position.set(g.x, 0.6+Math.sin(rt*4+i)*0.12, g.z); dummy.rotation.set(0, rt*2, 0); dummy.scale.setScalar(g.bonus?1.5:1); dummy.updateMatrix(); gemMesh.setMatrixAt(i, dummy.matrix); gemMesh.setColorAt(i, tmpC.setHex(GHOST_TYPES[g.type].col)); }
  gemMesh.instanceMatrix.needsUpdate = true; gemMesh.instanceColor.needsUpdate = true;
  // ---- particles / fx ----
  for(let i=0;i<PMAX;i++){ const p = PART[i]; if(p.life > 0){ p.life -= rdt; p.vy -= p.grav*rdt; p.x += p.vx*rdt; p.y = Math.max(0.05, p.y + p.vy*rdt); p.z += p.vz*rdt;
      pPos[i*3] = p.x; pPos[i*3+1] = p.y; pPos[i*3+2] = p.z; const f = Math.max(0, p.life*2); pCol[i*3] = p.r*f; pCol[i*3+1] = p.g*f; pCol[i*3+2] = p.b*f; } else pPos[i*3+1] = -50; }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
  for(let i=FX.length-1;i>=0;i--){ const f = FX[i]; f.t += rdt; const k = f.t/f.life; if(f.fan) f.mat.opacity = 0.55*(1-k); else { f.m.scale.setScalar(f.r0 + (f.r1-f.r0)*k); f.m.material.opacity = Math.max(0, 0.9*(1-k)); } if(k >= 1){ scene.remove(f.m); FX.splice(i,1); } }
  for(let i=ZAPS.length-1;i>=0;i--){ const z = ZAPS[i]; z.life -= rdt; z.l.material.opacity = Math.max(0, z.life/0.18); if(z.life <= 0){ scene.remove(z.l); ZAPS.splice(i,1); } }
  const az = P0 && !inMenu ? P0.z : -30;
  for(let i=0;i<AIRN;i++){ airPos[i*3+1] += rdt*0.4; airPos[i*3] += Math.sin(rt+i)*rdt*0.3; if(airPos[i*3+1] > 9) airPos[i*3+1] = 0.3; if(Math.abs(airPos[i*3+2]-az) > 40) airPos[i*3+2] = az + rnd(-38,38); } airGeo.attributes.position.needsUpdate = true;
  // ---- camera: locked MOBA view, far out, hero slightly above centre. Pause/loadout/menu = close-up. ----
  const sheetOpen = sheetMode==='pause' || sheetMode==='loadout';
  if(inMenu && (mainOpen || sheetMode==='loadout')){ const a = rt*0.25; camWant.set(Math.sin(a)*1.5+1.2, 2.3, -30 + 5.6); camLookWant.set(0, 1.1, -30); }
  else if(inMenu){ camWant.set(Math.sin(rt*0.1)*8, 22, -10 - ((rt*3)%60)); camLookWant.set(0, 0, camWant.z - 22); }
  else if(P0 && (state==='pause' || (inspect && state==='play'))){ const a = P0.face + 0.45 + (state==='pause'?rt*0.35:0); camWant.set(P0.x + Math.sin(a)*6.2*P0.grow, 2.6*P0.grow, P0.z + Math.cos(a)*6.2*P0.grow); camLookWant.set(P0.x, 0.95*P0.grow, P0.z); }
  else if(P0){ const far = isMobile ? 1.12 : 1, bg = P0.ballT>0 ? 1.25 : 1; const bossPull = (BOSS && BOSS.alive && BOSS.awake) ? clamp((BOSS.z - P0.z)*0.45, -9, 0) : 0; camWant.set(P0.x*0.8, 23*far*bg, P0.z + 19*far*bg + bossPull); camLookWant.set(P0.x*0.8, 0, P0.z + 2.5 + bossPull); }
  else { camWant.copy(camera.position); camLookWant.copy(camLook); }
  camLook.lerp(camLookWant, Math.min(1, (inMenu?3:7)*rdt)); camera.position.lerp(camWant, Math.min(1, (inMenu?2:6)*rdt));
  if(shake > 0){ camera.position.x += rnd(-1,1)*shake*0.6; camera.position.y += rnd(-1,1)*shake*0.4; shake = Math.max(0, shake - rdt*2.5); }
  camera.lookAt(camLook);
  if(sheetOpen){ const r = $('doll').getBoundingClientRect(), s = $('screen').getBoundingClientRect(); const dx = r.left + r.width/2 - s.left, dy = r.top + r.height/2 - s.top; camera.setViewOffset(SW, SH, SW/2 - dx, SH/2 - dy, SW, SH); }
  else if(inMenu && mainOpen) camera.setViewOffset(SW, SH, -SW*(isMobile?0.12:0.2), -SH*0.02, SW, SH);
  else camera.clearViewOffset();
  // signs fade out once you walk under them, so they never block the view (and hide in close-ups)
  for(const sg of SIGNS){ let o = 1; if(!inMenu && P0){ o = clamp((P0.z - sg.position.z - 2)/10, 0, 1); if(state==='pause' || inspect) o = hyp(P0.x-sg.position.x, P0.z-sg.position.z) < 25 ? 0 : o; } else if(inMenu && sheetMode==='loadout') o = 0; sg.material.opacity = o; sg.visible = o > 0.01; }
  placeLights(camLook.z); heroLight.position.set(P0&&!inMenu?P0.x:0, 3.5, (P0&&!inMenu?P0.z:-30)+1.5);
  cv.style.filter = blueT > 0 && state==='play' ? 'invert(0.92) hue-rotate(180deg)' : '';
  // ---- draw (HYPER motion-blur trails) ----
  const blur = SAVE.set.blur && state==='play' ? Math.min(0.72, hyper*0.13) : 0; fadeMat.opacity = 1 - blur;
  renderer.clearDepth(); renderer.render(fadeScene, fadeCam); renderer.clearDepth(); renderer.render(scene, camera);
  // ---- HUD ----
  if(state==='play' || state==='pause' || state==='jack' || state==='vacuum'){ updateHud(); updateTags(); flushDn(G, false); if(BOSS) flushDn([BOSS], false); if(P0) flushDn([P0], true); }
  for(const D of DN){ if(D.life <= 0) continue; D.life -= rdt; D.y += rdt*1.6; const [sx, sy, f] = project(D.x, D.y, D.z); D.el.style.left = sx+'px'; D.el.style.top = sy+'px'; D.el.style.opacity = clamp(D.life*2, 0, 1); if(D.life <= 0 || !f) D.el.style.display = 'none'; }
}
requestAnimationFrame(loop);
toMenu();   // boot: main menu, with the club alive behind it
window.__pac = {get state(){ return state; }, get P(){ return player(); }, ST, get BOSS(){ return BOSS; }, start:(m,o)=>startRun(m||'campaign',o), give:n=>gainXP(player(), n),
  choose:i=>{ if(jackOffers) chooseOffer(jackOffers[i]); }, get offers(){ return jackOffers; }, SAVE, toMenu, openPause, closePause, openSheet, get HEROES(){ return HEROES; }, get G(){ return G; }, get PATS(){ return PATS; }};
