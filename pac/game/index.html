<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAC — Judgement Day</title>
<!--
  PAC — v0.5.0 (Claude, 2026-10-20). Start menu + quick intro + LEVEL 1 (learning level) to character level 6 + boss.
  Built from Brent's rulings in chat 2026-10-20 (this build's spec):
   - start menu carries character select (unlocked in colour, locked as silhouettes); quick skippable intro of the 15 beats
   - level 1 = a nightclub of our own neon universe; no ghosts at the start; eat white dots laid in circles, figure-eights,
     S-curves; dings climb in pitch through a pattern, the last dot explodes for a bonus; finishing patterns builds HYPER
     (motion blur + speed); dots sparkle like runway lights and lead you into the next room that matters
   - civilians dance; they flee; eating them costs ENERGY and scores nothing; props can be walked around or torn through
   - ladder: L1 movement ability -> L2 Common (showcase) -> L3 Rare (beside/opposite on the pie) -> L4 Mythic -> L5 rank-up -> L6 weapon
   - each ability learned brings a TOWER online (3 towers); after the last tower: the BOSS; beat him, walk out, level done
   - 7 ghost colours = 7 stats, each drops its own bonus; new colours debut as one BIG ghost first
   - blue orb: inverted-eclipse look; eating it inverts the screen, Pac grows, ghosts flee and can be eaten
   - pie HUD bottom centre (3 thirds light per ability, centre = movement; thumb drag on phones); menu: character / gear /
     stats / abilities / settings / quit; thin border; score top middle (hover/click for details); quick mute
  Controls: WASD / arrows / click-to-move / gamepad; SPACE = movement ability; TAB or right-mouse hold = close-up; ESC = menu.
-->
<style>
  :root{--bd:#2a3a7a;--ink:#dfe8ff;--dim:#8a98c4;--acc:#ffe14d;--bg:#020308;--panel:#090d22ee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  #frame{position:fixed;inset:4px;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
  canvas#gl{display:block;width:100%;height:100%}
  .hide{display:none!important}
  /* top middle score */
  #score{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#070a1ccc;border:1px solid var(--bd);border-radius:8px;
         padding:4px 14px;font-size:14px;letter-spacing:1px;cursor:pointer;z-index:5;text-align:center;min-width:150px}
  #score b{color:var(--acc);font-size:18px;font-variant-numeric:tabular-nums}
  #scoreDet{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:8px;
            padding:8px 14px;font-size:13px;line-height:1.6;z-index:6;display:none;min-width:220px;font-variant-numeric:tabular-nums}
  #score:hover + #scoreDet,#scoreDet.open{display:block}
  #scoreDet div{display:flex;justify-content:space-between;gap:18px}
  #topR{position:absolute;top:8px;right:10px;display:flex;gap:6px;z-index:5}
  .btn{background:#0b1030;border:1px solid var(--bd);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:14px;cursor:pointer}
  .btn:hover{border-color:#5a7aff}
  #status{position:absolute;top:10px;left:12px;z-index:5;font-size:12px;line-height:1.5;text-shadow:0 0 5px #000;pointer-events:none;width:210px}
  .bar{height:6px;border-radius:3px;background:#161b33;overflow:hidden;margin:2px 0 4px}
  .bar i{display:block;height:100%}
  #buffs span{display:inline-block;margin-right:6px;padding:1px 5px;border-radius:4px;font-size:11px;border:1px solid #fff3}
  #bossBar{position:absolute;top:46px;left:50%;transform:translateX(-50%);width:min(420px,60%);z-index:5;text-align:center;font-size:12px;letter-spacing:2px}
  /* pie HUD */
  #pie{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:132px;height:132px;z-index:5;touch-action:none;opacity:.8}
  #say{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#0b1030e6;border:1px solid #2a6cff;color:#fff;padding:7px 14px;
       border-radius:10px;font-size:16px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:5}
  #toast{position:absolute;right:12px;bottom:14px;max-width:280px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #toast div{background:#0b1030e6;border-left:3px solid var(--acc);padding:6px 10px;border-radius:5px;font-size:13px;animation:fin .3s}
  @keyframes fin{from{opacity:0;transform:translateX(20px)}}
  #big{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:46px;font-weight:800;color:var(--acc);text-shadow:0 0 18px #ffb400;
       opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:3px;z-index:5;white-space:nowrap}
  #glitch{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;mix-blend-mode:screen}
  /* overlays */
  .ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#020308e6}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:20px 24px;max-width:min(860px,94%)}
  h1{margin:0 0 4px;font-size:44px;letter-spacing:4px;color:var(--acc);text-shadow:0 0 22px #ff9d00}
  h2{margin:0 0 10px;font-size:20px;letter-spacing:2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .chr{width:120px;height:140px;border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:#070a1c}
  .chr.sel{border-color:var(--acc);box-shadow:0 0 14px #ffb40055}
  .chr.lock{cursor:not-allowed;opacity:.55}
  .chr .dot{width:58px;height:58px;border-radius:50%;background:#ffd21f}
  .chr.lock .dot{background:#1a1e30;box-shadow:inset 0 0 0 2px #2f3550}
  .menuBtns{display:flex;flex-direction:column;gap:8px;margin-top:18px;align-items:center}
  .menuBtns .btn{width:220px;font-size:16px;padding:10px}
  /* jackpot */
  #jack .reels{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
  .reel{width:84px;height:84px;border:2px solid #b8860b;border-radius:10px;overflow:hidden;background:#05060f;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
  .offers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .offer{width:220px;border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;background:#070a1c;text-align:left}
  .offer:hover{border-color:var(--acc)}
  .offer .k{font-size:11px;letter-spacing:2px;color:var(--dim)}
  .offer .n{font-size:17px;font-weight:700;margin:4px 0}
  .offer .d{font-size:13px;color:#c5cff0;line-height:1.4}
  .rar-common{color:#cfd6e8}.rar-rare{color:#5aa8ff}.rar-mythic{color:#ffb627}
  /* pause menu */
  #pause .card{width:min(860px,94%);height:min(560px,90%);display:flex;gap:16px}
  #pause .tabs{display:flex;flex-direction:column;gap:6px;width:170px}
  #pause .tabs .btn{text-align:left}
  #pause .tabs .btn.on{border-color:var(--acc);color:var(--acc)}
  #pause .pane{flex:1;overflow:auto;font-size:14px;line-height:1.55}
  #pause table{border-collapse:collapse;width:100%}
  #pause td{padding:4px 6px;border-bottom:1px solid #1a2147}
  #portrait{width:100%;height:260px;border:1px solid var(--bd);border-radius:8px;background:transparent}
  #introC{position:absolute;inset:0;width:100%;height:100%;z-index:11;background:#000}
  #skip{position:absolute;right:14px;bottom:12px;z-index:12;color:#aaa;font-size:12px}
  @media (max-width:600px){h1{font-size:30px}.offer{width:100%}#pause .card{flex-direction:column}#pause .tabs{flex-direction:row;flex-wrap:wrap;width:auto}}
</style></head><body>
<div id="frame">
  <canvas id="gl"></canvas>
  <canvas id="glitch"></canvas>
  <div id="status"></div>
  <div id="score" title="click for details">SCORE <b id="scoreN">0</b></div>
  <div id="scoreDet"></div>
  <div id="bossBar" class="hide"><div>THE BOUNCER</div><div class="bar" style="height:8px"><i id="bossHp" style="background:#ff5a3c;width:100%"></i></div></div>
  <div id="topR"><button class="btn" id="muteB" title="mute (M)">🔊</button><button class="btn" id="menuB" title="menu (ESC)">☰</button></div>
  <svg id="pie" viewBox="-66 -66 132 132"></svg>
  <div id="say"></div><div id="toast"></div><div id="big"></div>

  <!-- START MENU -->
  <div class="ov" id="start"><div class="card" style="text-align:center">
    <h1>PAC</h1><div class="sub">JUDGEMENT DAY · prototype v0.5 · level 1</div>
    <div class="row" id="chars"></div>
    <div class="menuBtns">
      <button class="btn" id="bStart">Start Game</button>
      <button class="btn" id="bIntro">Watch Intro</button>

    </div>
  </div></div>
  <!-- JACKPOT LEVEL-UP -->
  <div class="ov hide" id="jack"><div class="card" style="text-align:center">
    <h2 id="jackT">LEVEL UP</h2>
    <div class="reels"><div class="reel" id="r0">?</div><div class="reel" id="r1">?</div><div class="reel" id="r2">?</div></div>
    <div class="offers" id="offers"></div>
    <div style="margin-top:14px"><button class="btn" id="spd">⏩ Speed up</button></div>
  </div></div>
  <!-- PAUSE / CHARACTER -->

    <div class="tabs">
      <button class="btn on" data-t="char">Character</button><button class="btn" data-t="gear">Gear</button>
      <button class="btn" data-t="stats">Stats</button><button class="btn" data-t="abil">Abilities</button>
      <button class="btn" data-t="set">Settings</button>

    </div>
    <div class="pane" id="pane"></div>
  </div></div>
  <!-- END SCREENS -->
  <div class="ov hide" id="endS"><div class="card" style="text-align:center"><h2 id="endT"></h2><div id="endB" style="font-size:14px;line-height:1.7;margin:10px 0 16px"></div>
    <div class="row"><button class="btn" id="bAgain">Play Again</button><button class="btn" id="bMenu2">Main Menu</button></div></div></div>
  <canvas id="introC" class="hide"></canvas><div id="skip" class="hide">click / any key to skip</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// =====================================================================================================
// 0. SETTINGS + SAVE  (localStorage is a convenience only; game works without it)
// =====================================================================================================
const SAVE_KEY = 'pac-proto-save-v1';
let SAVE = {unlocked:['pac'], best:0, muted:false, voice:false, blur:true, vol:0.7};
try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s) SAVE = Object.assign(SAVE, s); }catch(e){}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }
const $ = id => document.getElementById(id);

// =====================================================================================================
// 1. RENDERER / SCENE / CAMERA   (1 unit = 1 metre; Pac stands ~1.7 m)
// =====================================================================================================
const cv = $('gl');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.autoClear = false;   // we clear manually so HYPER can leave motion-blur trails
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x020308, 60, 150);
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 500);
function resize(){ const r = $('frame').getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width/r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// motion-blur fade quad (drawn before the scene; opacity < 1 leaves trails)
const fadeScene = new THREE.Scene(), fadeCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fadeMat = new THREE.MeshBasicMaterial({color:0x020308, transparent:true, opacity:1, depthTest:false, depthWrite:false});
fadeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), fadeMat));
scene.add(new THREE.HemisphereLight(0x3a4cff, 0x020108, 0.5));
const LIGHT_DIR = new THREE.Vector3(-0.4, 1, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xbfd0ff, 0.45); sun.position.copy(LIGHT_DIR).multiplyScalar(50); scene.add(sun);

// =====================================================================================================
// 2. INK HATCH SHADER — every character + gear: muted, matte, sketched; areas never filled solid
//    uGloss = shine of better gear; uEmit = glow of epic gear
// =====================================================================================================
const hatchUniforms = { uTime:{value:0}, uLight:{value:LIGHT_DIR} };
const HATCH_VS = `
  varying vec3 vN; varying vec3 vW; varying vec3 vC;
  void main(){
    vec4 p = vec4(position,1.0); vec3 n = normal;
    #ifdef USE_INSTANCING
      p = instanceMatrix * p; n = mat3(instanceMatrix) * n;
    #endif
    vC = vec3(1.0);
    #ifdef USE_INSTANCING_COLOR
      vC = instanceColor;
    #endif
    vec4 w = modelMatrix * p; vW = w.xyz; vN = normalize(mat3(modelMatrix) * n);
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;
const HATCH_FS = `
  uniform vec3 uTint; uniform vec3 uInk; uniform vec3 uLight; uniform float uTime;
  uniform float uGloss; uniform vec3 uEmit; uniform float uDensity;
  varying vec3 vN; varying vec3 vW; varying vec3 vC;
  float h(float n){ return fract(sin(n)*43758.5453); }
  float strokes(vec2 p, float ang, float gap, float seed){
    vec2 d = vec2(cos(ang), sin(ang)), q = vec2(-d.y, d.x);
    float t = dot(p, d) + sin(dot(p, q)*0.045 + seed*7.0)*2.2 + sin(dot(p,q)*0.17+seed)*0.7;
    float f = abs(fract(t/gap) - 0.5) * gap;
    float breakup = step(0.18, h(floor(dot(p,q)/9.0) + floor(t/gap)*3.1 + seed));
    return (1.0 - smoothstep(0.55, 1.35, f)) * breakup;
  }
  void main(){
    vec3 n = normalize(vN);
    float ndl = clamp(dot(n, normalize(uLight)), 0.0, 1.0);
    vec3 V = normalize(cameraPosition - vW);
    float rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 2.0);
    float tone = ndl*0.75 + 0.25 - rim*0.25;
    float s8 = floor(uTime*8.0);
    vec2 p = gl_FragCoord.xy + vec2(h(s8)*3.0, h(s8+1.7)*3.0);
    float g = 3.6 * uDensity, ink = 0.0;
    if(tone < 0.86) ink = max(ink, strokes(p, 0.78, g, 1.0+s8*0.13));
    if(tone < 0.62) ink = max(ink, strokes(p, -0.70, g, 2.0+s8*0.11));
    if(tone < 0.42) ink = max(ink, strokes(p, 0.10, g*0.9, 3.0+s8*0.07));
    if(tone < 0.24) ink = max(ink, strokes(p, 1.45, g*0.8, 4.0+s8*0.05));
    vec3 col = mix(uTint * vC * (0.72 + 0.38*tone), uInk, ink * 0.85);
    vec3 H = normalize(normalize(uLight) + V);
    col += vec3(1.0) * pow(clamp(dot(n,H),0.0,1.0), 36.0) * uGloss * 1.2 + rim * uGloss * 0.35;
    col += uEmit * (0.6 + 0.4*rim);
    gl_FragColor = vec4(col, 1.0);
  }`;
function hatchMat(tint, o={}){
  return new THREE.ShaderMaterial({ uniforms:Object.assign({
      uTint:{value:new THREE.Color(tint)}, uInk:{value:new THREE.Color(o.ink||0x14110e)},
      uGloss:{value:o.gloss||0}, uEmit:{value:new THREE.Color(o.emit||0)}, uDensity:{value:o.density||1}}, hatchUniforms),
    vertexShader:HATCH_VS, fragmentShader:HATCH_FS });
}
const OUT_VS = `
  uniform float uTime; uniform float uW;
  float h(float n){ return fract(sin(n)*43758.5453); }
  void main(){
    vec3 p = position; vec3 n = normal;
    #ifdef USE_INSTANCING
      p = (instanceMatrix * vec4(p,1.0)).xyz; n = mat3(instanceMatrix) * n;
    #endif
    float s = floor(uTime*8.0);
    float j = 0.7 + 0.6*h(dot(position, vec3(12.9,78.2,37.7)) + s);
    gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(p + normalize(n)*uW*j, 1.0);
  }`;
function outlineMat(w=0.035){ return new THREE.ShaderMaterial({uniforms:{uTime:hatchUniforms.uTime, uW:{value:w}},
  vertexShader:OUT_VS, fragmentShader:`void main(){ gl_FragColor = vec4(0.047,0.04,0.031,1.0); }`, side:THREE.BackSide}); }
function inked(geo, mat, w=0.035){ const g = new THREE.Group(); g.add(new THREE.Mesh(geo, outlineMat(w)), new THREE.Mesh(geo, mat)); return g; }
const glowTex = (()=>{ const c = document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g = x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.25,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
function initColors(m, n, hex=0xffffff){ const c = new THREE.Color(hex); const a = new Float32Array(n*3); for(let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; } m.instanceColor = new THREE.InstancedBufferAttribute(a, 3); m.instanceColor.setUsage(THREE.DynamicDrawUsage); }
function at(o,x,y,z){ o.position.set(x,y,z); return o; }
function glow(color, size, opacity=1){ const s = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false})); s.scale.set(size,size,1); return s; }

// =====================================================================================================
// 3. THE CLUB — level 1's map: rooms connected by doorways. Dark, glossy, satin neon. Our own universe.
//    Entrance (start) -> Dance Floor (tower 1) -> Bar | VIP (tower 2) -> Backstage (tower 3) -> Main Stage (boss)
// =====================================================================================================
function floorTexture(seed, plate, base){
  const N = 1024, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d');
  let r = seed; const rnd = ()=>{ r = (r*16807)%2147483647; return r/2147483647; };
  x.fillStyle = base; x.fillRect(0,0,N,N);
  for(let py=0; py<N; py+=plate) for(let px=0; px<N; px+=plate){
    const v = 10 + rnd()*14; x.fillStyle = `rgb(${v*0.75|0},${v*0.7|0},${v*1.1|0})`; x.fillRect(px+2,py+2,plate-4,plate-4);
    x.globalAlpha = 0.07; x.strokeStyle = '#a090ff';
    for(let i=0;i<8;i++){ const yy = py+4+rnd()*(plate-8); x.beginPath(); x.moveTo(px+4,yy); x.lineTo(px+plate-4,yy+(rnd()-.5)*3); x.stroke(); }
    x.globalAlpha = 1; x.fillStyle = 'rgba(140,120,255,0.09)'; x.fillRect(px+2,py+2,plate-4,2); x.fillRect(px+2,py+2,2,plate-4);
    x.fillStyle = 'rgba(0,0,0,0.6)'; x.fillRect(px+2,py+plate-4,plate-4,2); x.fillRect(px+plate-4,py+2,2,plate-4);
    x.fillStyle = 'rgba(170,170,210,0.3)'; for(const [ox,oy] of [[8,8],[plate-10,8],[8,plate-10],[plate-10,plate-10]]){ x.beginPath(); x.arc(px+ox,py+oy,2,0,7); x.fill(); }
  }
  x.fillStyle = '#010104'; for(let i=0;i<=N;i+=plate){ x.fillRect(i-1,0,3,N); x.fillRect(0,i-1,N,3); }
  x.strokeStyle = 'rgba(0,0,0,0.85)'; x.lineWidth = 1.3;
  for(let k=0;k<22;k++){ let cx=rnd()*N, cy=rnd()*N; x.beginPath(); x.moveTo(cx,cy); for(let j=0;j<7;j++){ cx+=(rnd()-.5)*40; cy+=(rnd()-.5)*40; x.lineTo(cx,cy);} x.stroke(); }
  for(let k=0;k<36;k++){ const gx=rnd()*N, gy=rnd()*N, gr=20+rnd()*90; const g=x.createRadialGradient(gx,gy,0,gx,gy,gr);
    g.addColorStop(0,'rgba(0,0,0,0.5)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(gx-gr,gy-gr,gr*2,gr*2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
const BOUNDS = {x0:-45, x1:45, z0:-145, z1:65};
const floorTex = floorTexture(11, 128, '#05050c'); floorTex.repeat.set(90/10, 210/10);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 210), new THREE.MeshStandardMaterial({color:0xb0b0d0, map:floorTex, bumpMap:floorTex, bumpScale:0.7, roughness:0.25, metalness:0.7}));
floor.rotation.x = -Math.PI/2; floor.position.set(0,0,-40); scene.add(floor);
const outside = new THREE.Mesh(new THREE.PlaneGeometry(700,700), new THREE.MeshBasicMaterial({color:0x010104})); outside.rotation.x = -Math.PI/2; outside.position.y = -0.05; scene.add(outside);

const WALLS = [];   // AABBs {x0,x1,z0,z1,solid,mesh}
const wallMat = new THREE.MeshStandardMaterial({color:0x07081a, roughness:0.35, metalness:0.8});
function neonStrip(x0,z0,x1,z1,y,color,w=0.09){
  const len = Math.hypot(x1-x0,z1-z0); const m = new THREE.Mesh(new THREE.BoxGeometry(len, w, w), new THREE.MeshBasicMaterial({color}));
  m.position.set((x0+x1)/2, y, (z0+z1)/2); m.rotation.y = -Math.atan2(z1-z0, x1-x0); scene.add(m);
  const n = Math.max(1, Math.floor(len/5)); for(let i=0;i<=n;i++){ const g = glow(color, 3.4, 0.4); g.position.set(x0+(x1-x0)*i/n, y, z0+(z1-z0)*i/n); scene.add(g); }
  return m;
}

    const arm = new THREE.Group(); arm.position.set(s*p.bodyR*0.98, p.bodyR*0.05, 0); B.body.add(arm); B['arm'+k]=arm;

  eight:(cx,cz,w,h,n=34)=>Array.from({length:n},(_,i)=>{ const a=i/n*Math.PI*2; return [cx+Math.sin(a)*w, cz+Math.sin(2*a)*h]; }),
  s:(x0,z0,x1,z1,amp,n=22)=>Array.from({length:n},(_,i)=>{ const f=i/(n-1); const dx=x1-x0, dz=z1-z0, L=Math.hypot(dx,dz)||1; const px=-dz/L, pz=dx/L, o=Math.sin(f*Math.PI*2)*amp; return [x0+dx*f+px*o, z0+dz*f+pz*o]; }),
  line:(x0,z0,x1,z1,n=14)=>Array.from({length:n},(_,i)=>{ const f=i/(n-1); return [x0+(x1-x0)*f, z0+(z1-z0)*f]; }),
  spiral:(cx,cz,r,turns,n=36)=>Array.from({length:n},(_,i)=>{ const f=i/n, a=f*turns*Math.PI*2; return [cx+Math.cos(a)*r*(1-f*0.85), cz+Math.sin(a)*r*(1-f*0.85)]; }),
  zig:(x0,z0,x1,z1,amp,n=20)=>Array.from({length:n},(_,i)=>{ const f=i/(n-1); const dx=x1-x0, dz=z1-z0, L=Math.hypot(dx,dz)||1; const px=-dz/L, pz=dx/L, o=((i%4<2)?1:-1)*amp*((i%2)?0.5:1); return [x0+dx*f+px*o, z0+dz*f+pz*o]; })
};

function leadTo(x, z){ // a runway of dots from wherever Pac is to (x,z), plus a ring a safe distance around it
  const pts = []; const dx = x-Pc.x, dz = z-Pc.z, L = Math.hypot(dx,dz); const n = Math.min(50, Math.floor(L/1.6));
  for(let i=3;i<n;i++){ const f = i/n; pts.push([Pc.x+dx*f + Math.sin(f*Math.PI*3)*2, Pc.z+dz*f]); }
  addPattern(pts); addPattern(shapes.circle(x, z, 11, 26));
}

let hyper = 0;   // 0..5 from finishing patterns -> motion blur + speed
function eatDot(i){
  const d = DOTS[i]; DOTS[i] = DOTS[DOTS.length-1]; DOTS.pop(); dotsDirty = true;
  const P = d.pat; P.eaten++; ST.dots++; addScore(10); gainXP(1);
  const prog = P.eaten / P.len;
  tone(420 + prog*780 + Math.min(P.eaten,30)*6, 0.06 - prog*0.03, 'square', 0.05);   // climbs in pitch, gets snappier
  if(P.eaten >= P.len && !P.done){ P.done = true; ST.patterns++;
    burst(d.x, 0.8, d.z, 0xffe14d, 40, 12); burst(d.x, 0.8, d.z, 0xffffff, 20, 6); ringFx(d.x, d.z, 6, 0xffe14d, 0.5);
    tone(1500, 0.25, 'sawtooth', 0.07, 0.3); noise(0.25, 0.12);
    const bonus = P.len*10; addScore(bonus); gainXP(Math.ceil(P.len/3)); hyper = Math.min(5, hyper+1); hyperDecay = 10;
    big('+'+bonus, 700); if(Math.random()<0.35) say('pattern');
    // hurt anything nearby — the last dot explodes
    areaDamage(d.x, d.z, 5, 12, 'pattern');
  }
}

  if(LOAD.mythic==='frenzy') Pc.hp = Math.min(Pc.maxhp, Pc.hp + (G.some(g=>Math.hypot(g.x-Pc.x,g.z-Pc.z)<ABIL.frenzy.rad)? ABIL.frenzy.heal*dt*3:0));

  // ---- death ----
  if(Pc.hp <= 0){ burst(Pc.x,1,Pc.z,0xffe14d,120,14); endLevel(false); }
}
function pushProp(w, dt){ if(!w.prop || w.cost<=0) return; w.push += dt; if(w.push > 0.35){ if(Pc.energy >= w.cost) breakProp(w, true); else toast('noenergy','Not enough energy to tear through that. Go around.'); w.push = 0; } }

function render(dt){
  // ---- hero rig animation ----
  if(hero){ const B = hero.bones, sp = Math.hypot(Pc.vx,Pc.vz), k = Math.min(1, sp/8);
    hero.root.position.set(Pc.x, 0, Pc.z); hero.root.rotation.y = Pc.face; hero.root.scale.setScalar(Pc.grow); pacLight.position.set(Pc.x, 3.5, Pc.z+1);
    B.legL.rotation.x = Math.sin(Pc.walk)*0.7*k; B.legR.rotation.x = -Math.sin(Pc.walk)*0.7*k;
    B.armL.rotation.x = -Math.sin(Pc.walk)*0.6*k; B.armR.rotation.x = Math.sin(Pc.walk)*0.6*k; B.armL.rotation.z = -0.25; B.armR.rotation.z = 0.25;
    if(swingT > 0){ B.armR.rotation.x = -2.2 + (0.25-swingT)*14; }
    B.body.position.y = PAC_P.bodyR*0.95 + Math.abs(Math.sin(Pc.walk))*0.06*k; B.body.rotation.x = 0.12*k;
    const open = 0.08 + (0.5+0.5*Math.sin(t*16))*0.5*(sp>0.5||holeT>0?0.8:0.15) + (holeT>0?0.4:0); hero.jawU.rotation.x = -open; hero.jawL.rotation.x = open*0.6;
    if(hero.auraPulse) hero.auraPulse.material.opacity = 0.32 + 0.18*Math.sin(t*5); }
  // ---- world animation: club lights on the beat ----
  const beat = (t*2.1)%1; const onBeat = beat < 0.12;
  if(state==='play' && AC && !SAVE.muted){ beatT -= 1; if(onBeat && !render.lastBeat) { tone(55, 0.12, 'sine', 0.14, 0.5); if(Math.floor(t*2.1)%2) noise(0.04, 0.03); } }
  render.lastBeat = onBeat;
  for(let i=0;i<tilesX*tilesZ;i++){ const a = Math.floor(i/tilesZ), b = i%tilesZ; const v = Math.sin(t*3 + a*0.7 + b*1.3 + Math.floor(t*2.1)); tmpC.copy(TILE_COLS[(a+b+Math.floor(t*2.1))%5]).multiplyScalar(v>0.3?(onBeat?1:0.7):0.05); tiles.setColorAt(i, tmpC); }
  tiles.instanceColor.needsUpdate = true;
  discos.forEach((d,i)=>{ d.rotation.y += dt*0.8; });
  lasers.forEach(L=>{ L.m.rotation.z = Math.sin(t*0.7+L.ph)*0.9; L.m.rotation.x = Math.cos(t*0.5+L.ph)*0.6; });
  LIGHTS.forEach((L,i)=>{ L.intensity = 4.2 + Math.sin(t*2.1*Math.PI + i)*1.2; });
  // ---- dots: runway-light sparkle (chase along the pattern) ----
  if(dotsDirty){ dotMesh.count = Math.min(DMAX, DOTS.length); dotsDirty = false; }
  for(let i=0;i<dotMesh.count;i++){ const d = DOTS[i]; const s = 0.5+0.5*Math.sin(t*9 - d.idx*0.55); const pop = Math.min(1, (t-d.born)*3);
    dummy.position.set(d.x, 0.55 + s*0.12, d.z); dummy.rotation.set(0,0,0); dummy.scale.setScalar((0.8 + s*0.45)*pop); dummy.updateMatrix(); dotMesh.setMatrixAt(i, dummy.matrix);
    tmpC.setRGB(0.75+s*0.25, 0.75+s*0.25, 0.7+s*0.3*(d.pat.eaten/d.pat.len+0.4)); dotMesh.setColorAt(i, tmpC); }
  dotMesh.instanceMatrix.needsUpdate = true; if(dotMesh.instanceColor) dotMesh.instanceColor.needsUpdate = true;
  // ---- civilians ----
  civBody.count = civBodyO.count = civHead.count = civHeadO.count = CIV.length;
  for(let i=0;i<CIV.length;i++){ const c = CIV[i]; const bob = c.panic>0 ? Math.abs(Math.sin(c.ph*2))*0.15 : Math.abs(Math.sin(c.ph))*0.12;
    dummy.position.set(c.x, bob, c.z); dummy.rotation.set(0, c.ph*0.3, Math.sin(c.ph)*0.12*(c.panic>0?0:1)); dummy.scale.set(1,1,1); dummy.updateMatrix();
    civBody.setMatrixAt(i, dummy.matrix); civBodyO.setMatrixAt(i, dummy.matrix); civBody.setColorAt(i, CIV_COLS[c.col]);
    dummy.position.set(c.x, 1.55+bob, c.z); dummy.updateMatrix(); civHead.setMatrixAt(i, dummy.matrix); civHeadO.setMatrixAt(i, dummy.matrix); }
  [civBody, civBodyO, civHead, civHeadO].forEach(m=>m.instanceMatrix.needsUpdate = true); if(civBody.instanceColor) civBody.instanceColor.needsUpdate = true;
  // ---- ghosts ----
  ghostM.count = ghostO.count = G.length; eyesM.count = G.length*2;
  for(let i=0;i<G.length;i++){ const g = G[i]; const s = g.scale*(g.hitT>0?1.12:1);
    dummy.position.set(g.x, Math.sin(g.bob)*0.12*g.scale, g.z); dummy.rotation.set(0, Math.atan2(Pc.x-g.x, Pc.z-g.z) + (blueT>0?Math.PI:0), 0); dummy.scale.set(s,s,s); dummy.updateMatrix();
    ghostM.setMatrixAt(i, dummy.matrix); ghostO.setMatrixAt(i, dummy.matrix);
    if(g.hitT>0) tmpC.setHex(0xffffff); else if(blueT>0 && !g.big) tmpC.setHex(blueT<2 && Math.floor(t*8)%2 ? 0xffffff : 0x2a4aff); else tmpC.setHex(GHOST_TYPES[g.type].col);
    ghostM.setColorAt(i, tmpC);
    const m = dummy.matrix.clone(); for(const e of [-1,1]){ const ex = new THREE.Vector3(e*0.22, 1.15, 0.52).applyMatrix4(m); dummy.position.copy(ex); dummy.rotation.set(0,0,0); dummy.scale.set(g.scale, g.scale*1.3, g.scale*0.6); dummy.updateMatrix(); eyesM.setMatrixAt(i*2+(e>0?1:0), dummy.matrix); } }
  ghostM.instanceMatrix.needsUpdate = ghostO.instanceMatrix.needsUpdate = eyesM.instanceMatrix.needsUpdate = true; if(ghostM.instanceColor) ghostM.instanceColor.needsUpdate = true;
  // ---- gems ----
  gemMesh.count = Math.min(600, GEMS.length); for(let i=0;i<gemMesh.count;i++){ const g = GEMS[i]; dummy.position.set(g.x, 0.6+Math.sin(t*4+i)*0.12, g.z); dummy.rotation.set(0, t*2, 0); dummy.scale.setScalar(g.bonus?1.4:1); dummy.updateMatrix(); gemMesh.setMatrixAt(i, dummy.matrix); gemMesh.setColorAt(i, tmpC.setHex(GHOST_TYPES[g.type].col)); }
  gemMesh.instanceMatrix.needsUpdate = true; if(gemMesh.instanceColor) gemMesh.instanceColor.needsUpdate = true;
  // ---- particles / fx ----
  const pdt = state==='play'?dt:0;
  for(let i=0;i<PMAX;i++){ const p = PART[i]; if(p.life>0){ p.life -= pdt; p.vy -= 14*pdt; p.x += p.vx*pdt; p.y = Math.max(0.05, p.y+p.vy*pdt); p.z += p.vz*pdt;
      pPos[i*3]=p.x; pPos[i*3+1]=p.y; pPos[i*3+2]=p.z; const f = Math.max(0,p.life*2); pCol[i*3]=p.r*f; pCol[i*3+1]=p.g*f; pCol[i*3+2]=p.b*f; } else pPos[i*3+1] = -50; }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
  for(let i=FX.length-1;i>=0;i--){ const f = FX[i]; f.t += pdt; const k = f.t/f.life; f.m.scale.setScalar(f.r0+(f.r1-f.r0)*k); f.m.material.opacity = Math.max(0, 0.9*(1-k)); if(k>=1){ scene.remove(f.m); FX.splice(i,1); } }
  for(let i=ZAPS.length-1;i>=0;i--){ const z = ZAPS[i]; z.life -= pdt; z.l.material.opacity = Math.max(0, z.life/0.18); if(z.life<=0){ scene.remove(z.l); ZAPS.splice(i,1); } }
  // ---- camera: locked, far; Pac slightly above centre; TAB / right mouse or pause = close-up ----
  const close = inspect || state==='pause';
  const camWant = close ? new THREE.Vector3(Pc.x + Math.sin(Pc.face+0.45+(state==='pause'?t*0.4:0))*5.2*Pc.grow, 2.6*Pc.grow, Pc.z + Math.cos(Pc.face+0.45+(state==='pause'?t*0.4:0))*5.2*Pc.grow)
                        : new THREE.Vector3(Pc.x*0.85, 0, Pc.z).add(CAM_OFF).add(new THREE.Vector3(0, transformT>0?8:0, transformT>0?6:0));
  camLook.lerp(close ? new THREE.Vector3(Pc.x, 1.1*Pc.grow, Pc.z) : new THREE.Vector3(Pc.x*0.85, 0, Pc.z+3.5), Math.min(1, 7*dt));
  camera.position.lerp(camWant, Math.min(1, 6*dt)); camera.lookAt(camLook);
  // ---- screen inversion during the blue orb ----
  cv.style.filter = blueT > 0 && state==='play' ? 'invert(0.92) hue-rotate(180deg)' : '';
  drawGlitch();
  // ---- draw (with HYPER motion-blur trails) ----
  const blur = SAVE.blur && state==='play' ? Math.min(0.75, hyper*0.13) : 0;
  fadeMat.opacity = 1 - blur;
  renderer.clearDepth(); renderer.render(fadeScene, fadeCam); renderer.clearDepth(); renderer.render(scene, camera);
  // ---- HUD ----
  if(state==='play' || state==='pause' || state==='jack'){
    const xpN = XP_NEED[Math.min(6,Pc.level+1)], xpP = XP_NEED[Pc.level]||0, xf = Pc.level>=6?1:(Pc.xp-xpP)/(xpN-xpP);
    const buffs = Object.entries(BUFF).filter(([k,v])=>v>0).map(([k])=>`<span>${{dmg:'DMG+',speed:'SPD+',xp:'XP×2',cd:'CD-',magnet:'MAGNET'}[k]}</span>`).join('');
    $('status').innerHTML = `<b style="color:#ffe14d">${HEROES[heroKey].name}</b> · Lv ${Pc.level}${Pc.level>=6?' (max)':''}
      <div class="bar"><i style="width:${(xf*100).toFixed(0)}%;background:#ffe14d"></i></div>
      HP <div class="bar"><i style="width:${(Pc.hp/Pc.maxhp*100).toFixed(0)}%;background:#ff3b5c"></i></div>
      Energy <div class="bar"><i style="width:${(Pc.energy/Pc.maxEnergy*100).toFixed(0)}%;background:#35e0ff"></i></div>
      ${Pc.shield>1?`Pac Shield <div class="bar"><i style="width:${(Pc.shield/40*100).toFixed(0)}%;background:#ffe14d"></i></div>`:''}
      ${hyper>0?`<span style="color:#ff2fd0">HYPER ×${hyper}</span> `:''}${blueT>0?`<span style="color:#4aa8ff">EAT MODE ${blueT.toFixed(1)}s</span>`:''}<div id="buffs">${buffs}</div>
      <span style="color:#8a98c4">${roomAt(Pc.x,Pc.z).name}</span>`;
    updatePie(dt); updateScore(); }
}
requestAnimationFrame(loop);
buildPie(); renderChars();
window.__pac = {Pc, ST, get state(){return state;}, start:startGame, give:(n)=>gainXP(n), choose:(i)=>{ if(jackOffers) choose(jackOffers[i], jackLv); }, LOAD:()=>LOAD, TOWERS, get BOSS(){return BOSS;}, killAllTowers:()=>TOWERS.forEach(T=>T.alive&&T.rise>=1&&killTower(T)), pause:openPause};
</script>
