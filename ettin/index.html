<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boinker & Oinker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
body{font-family:"Source Serif 4",Georgia,serif;background:#121418;color:#1c1208;padding:8px;margin:0}
.wrap{max-width:440px;margin:0 auto}
button{font-family:Cinzel,serif;border:1px solid #c9a227;background:#2a2e34;color:#f3e6c9;padding:10px 8px;cursor:pointer}
button.on{background:#9b2c2c;color:#fff}
.who,.rest{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.header{background:#16181c;color:#f3e6c9;padding:10px;border:1px solid #3a3f47}
.header h1{font-family:Cinzel,serif;margin:0;font-size:1.4rem}
.meta{color:#c9b48a;font-size:.78rem;margin:4px 0 8px}
img{width:100%;border:2px solid #c9a227;display:block;margin:0 0 8px;background:#2a1a10}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.nav button{padding:10px 2px;font-size:.68rem}
.sheet{background:#f3e6c9;border:1px solid #3a2412;padding:10px}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.box{background:#fff8e4;border:2px solid #3a2412;text-align:center;padding:8px 4px}
.k{font-family:Cinzel,serif;font-size:.62rem;color:#6a543c}
.v{font-size:1.45rem;font-weight:700}
.hp{border-color:#9b2c2c}.hp .v{font-size:1.8rem}
.pm{display:flex;justify-content:center;gap:6px;margin-top:6px}
.pm button{min-width:42px;font-size:1.2rem;padding:6px 0;background:#3a2412}
.btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
button.act{background:#3a2412}button.danger{background:#9b2c2c}
.abs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.ab{background:#fff8e4;border:2px solid #3a2412;text-align:center;padding:6px 2px;cursor:pointer}
.mod{font-size:1.4rem;font-weight:700}.sc,.sv{font-size:.72rem;color:#6a543c}.sv.p{color:#9b2c2c;font-weight:700}
.roll{min-height:110px;text-align:left;white-space:pre-wrap;color:#3a2412;font-size:.92rem;background:#fff8e4;border:2px solid #9b2c2c;padding:8px;margin-bottom:8px}
.sk{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ead7b0;cursor:pointer}
.dot{width:16px;height:16px;border:2px solid #3a2412;border-radius:50%;display:inline-block;margin-right:8px;background:#fff}.dot.on{background:#9b2c2c}
.bonus{font-weight:700}
h3{font-family:Cinzel,serif;color:#9b2c2c;font-size:.9rem;margin:10px 0 4px}
.use{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff8e4;border:2px solid #3a2412;padding:8px;margin:6px 0}
.hide{display:none}textarea{width:100%;min-height:80px;padding:8px;font:inherit;box-sizing:border-box}
</style></head><body><div class="wrap">
<div class="who"><button type="button" id="btnB" onclick="showHead('b')">BOINKER</button><button type="button" id="btnO" onclick="showHead('o')">OINKER</button></div>
<div class="header">
<img alt="Oinker right arm, Boinker left arm" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 160%22%3E%3Crect width=%22400%22 height=%22160%22 fill=%22%232a1a10%22/%3E%3Cellipse cx=%22200%22 cy=%22120%22 rx=%2280%22 ry=%2240%22 fill=%22%23efe6d6%22/%3E%3Ccircle cx=%22150%22 cy=%2264%22 r=%2236%22 fill=%22%23e6c2a6%22/%3E%3Ccircle cx=%22250%22 cy=%2264%22 r=%2236%22 fill=%22%23e6c2a6%22/%3E%3Ctext x=%22150%22 y=%2270%22 text-anchor=%22middle%22 font-size=%2211%22 fill=%22%233a2412%22 font-family=%22Georgia%22%3EOINKER%3C/text%3E%3Ctext x=%22250%22 y=%2270%22 text-anchor=%22middle%22 font-size=%2211%22 fill=%22%233a2412%22 font-family=%22Georgia%22%3EBOINKER%3C/text%3E%3C/svg%3E">
<h1 id="cname">OINKER</h1><div class="meta" id="csub"></div>
<div class="rest"><button type="button" onclick="shortRest()">Short Rest</button><button type="button" onclick="longRest()">Long Rest</button></div></div>
<div class="nav">
<button type="button" class="on" id="tcombat" onclick="tab('combat')">Combat</button>
<button type="button" id="tskills" onclick="tab('skills')">Skills</button>
<button type="button" id="tinventory" onclick="tab('inventory')">Gear</button>
<button type="button" id="talbum" onclick="tab('album')">Notes</button>
</div>
<div class="sheet"><div class="roll" id="rollout">Click a number. You will see where each + or - comes from. You roll the dice.</div>
<div id="pcombat">
<div class="row3">
<div class="box hp"><div class="k" id="hplab">OINKER HP</div><div class="v"><span id="hp">23</span>/<span id="hpmax">23</span></div>
<div class="pm"><button type="button" onclick="chgHP(-1)">-</button><button type="button" onclick="chgHP(1)">+</button></div></div>
<div class="box"><div class="k">TEMP</div><div class="v" id="tempv">0</div>
<div class="pm"><button type="button" onclick="chgTemp(-1)">-</button><button type="button" onclick="chgTemp(1)">+</button></div></div>
<div class="box"><div class="k">MAX</div><div class="v" id="maxv">23</div>
<div class="pm"><button type="button" onclick="chgMax(-1)">-</button><button type="button" onclick="chgMax(1)">+</button></div></div>
</div>
<div class="row3" style="margin-top:6px">
<div class="box" onclick="whyAC()"><div class="k">ARMOR</div><div class="v">13</div></div>
<div class="box" onclick="whyInit()"><div class="k">INIT</div><div class="v">+1</div></div>
<div class="box" onclick="whySpeed()"><div class="k">SPEED</div><div class="v">40</div></div>
</div>
<div class="row3" style="margin-top:6px">
<div class="box" onclick="whySize()"><div class="k">SIZE</div><div class="v" style="font-size:1rem">Large</div></div>
<div class="box"><div class="k">TYPE</div><div class="v" style="font-size:1rem">Giant</div></div>
<div class="box" onclick="whyVision()"><div class="k">VISION</div><div class="v" style="font-size:.9rem">Dark 60</div></div>
</div>
<div class="btns">
<button type="button" class="act" onclick="chgHP(-5)">-5</button>
<button type="button" class="act danger" onclick="chgHP(-10)">-10</button>
<button type="button" class="act" onclick="chgHP(5)">+5</button>
<button type="button" class="act" onclick="fullHeal()">Full</button>
</div>
<div class="abs" id="abs"></div>
<div class="row3">
<div class="box" onclick="whyPerc()"><div class="k">P.PERC</div><div class="v" id="pperc">10</div></div>
<div class="box" onclick="whyIns()"><div class="k">P.INS</div><div class="v" id="pins">10</div></div>
<div class="box" onclick="whyHD()"><div class="k">HIT DICE</div><div class="v" style="font-size:1rem" id="hdbox">2d12</div></div>
</div>
<h3>Actions</h3><div id="acts"></div>
</div>
<div id="pskills" class="hide"><h3>Skills</h3><div id="skills"></div></div>
<div id="pinventory" class="hide"><h3>Gear</h3><div id="gear"></div>
<p>Money <button type="button" class="act" onclick="chgGold(-1)">-</button> <span id="gold">40</span> gp <button type="button" class="act" onclick="chgGold(1)">+</button></p></div>
<div id="palbum" class="hide"><h3>Notes</h3><div id="story"></div><textarea id="notes"></textarea></div>
</div></div>
<script>
const WHY={Athletics:'Trained because Oinker is Barbarian 2.',Survival:'Trained because Oinker is Barbarian 2.','Animal Handling':'Trained because Boinker is Fighter 2.',Perception:'Trained because Boinker is Fighter 2.',Medicine:'Trained because background is Hermit.',Religion:'Trained because background is Hermit.'};
const HEADS={o:{name:'OINKER',sub:'Half-giant Ettin Barbarian 2, Hermit',int:8,wis:10,cha:14,cls:'barb',hd:'2d12',gear:'Greatsword +5 to hit, 2d6+3 slash. Axe +5 to hit, 1d8+3 slash.',story:'Right head and right arm.'},b:{name:'BOINKER',sub:'Half-giant Ettin Fighter 2, Hermit',int:12,wis:12,cha:10,cls:'fight',hd:'2d10',gear:'Brick mace +5 to hit, 1d6+3. Flail +5 to hit, 1d8+3.',story:'Left head and left arm.'}};
const SKILLS=[['Athletics','str',true],['Acrobatics','dex',false],['Sleight of Hand','dex',false],['Stealth','dex',false],['Arcana','int',false],['History','int',false],['Investigation','int',false],['Nature','int',false],['Religion','int',true],['Animal Handling','wis',true],['Insight','wis',false],['Medicine','wis',true],['Perception','wis',true],['Survival','wis',true],['Deception','cha',false],['Intimidation','cha',false],['Performance','cha',false],['Persuasion','cha',false]];
const ABNAME={str:'Strength',dex:'Dexterity',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const $=function(id){return document.getElementById(id)};
let who='o',skillOn={},gold=40,raging=false,reckless=false,rage=2,sw=1,surge=1;
let pool={o:{hp:23,max:23,temp:0},b:{hp:20,max:20,temp:0}};
SKILLS.forEach(function(s){skillOn[s[0]]=s[2]});
function cur(){return pool[who]}
function say(t){$('rollout').textContent=t}
function mod(s){return Math.floor((s-10)/2)}
function signed(n){return (n>=0?'+':'')+n}
function bodyMod(ab){if(ab==='str')return 3;if(ab==='dex')return 1;if(ab==='int')return mod(HEADS[who].int);if(ab==='wis')return mod(HEADS[who].wis);if(ab==='cha')return mod(HEADS[who].cha);return 0}
function tab(id){['combat','skills','inventory','album'].forEach(function(x){$('p'+x).className=x===id?'':'hide';$('t'+x).className=x===id?'on':'';})}
function paintHP(){var p=cur();$('hplab').textContent=HEADS[who].name+' HP';$('hp').textContent=p.hp;$('hpmax').textContent=p.max;$('tempv').textContent=p.temp;$('maxv').textContent=p.max;$('hdbox').textContent=HEADS[who].hd}
function paintActs(){var h='';if(HEADS[who].cls==='barb'){h+='<div class="use"><div><b>Greatsword</b></div><button type="button" class="act" onclick="showAtk(\'Greatsword\',\'2d6\')">Why</button></div>';h+='<div class="use"><div><b>Battleaxe</b></div><button type="button" class="act" onclick="showAtk(\'Battleaxe\',\'1d8\')">Why</button></div>';h+='<div class="use"><div><b>Rage</b></div><button type="button" class="act '+(raging?'danger':'')+'" onclick="doRage()">'+rage+'/2</button></div>';h+='<div class="use"><div><b>Reckless</b></div><button type="button" class="act '+(reckless?'danger':'')+'" onclick="doReck()">'+(reckless?'ON':'off')+'</button></div>';}else{h+='<div class="use"><div><b>Brick mace</b></div><button type="button" class="act" onclick="showAtk(\'Brick mace\',\'1d6\')">Why</button></div>';h+='<div class="use"><div><b>Flail</b></div><button type="button" class="act" onclick="showAtk(\'Flail\',\'1d8\')">Why</button></div>';h+='<div class="use"><div><b>Second Wind</b></div><button type="button" class="act" onclick="doSW()">'+sw+'/1</button></div>';h+='<div class="use"><div><b>Action Surge</b></div><button type="button" class="act" onclick="doSurge()">'+surge+'/1</button></div>';}$('acts').innerHTML=h}
function showAtk(n,wdie){var msg=n+'\nTo hit +5 = Strength +3 (17) + proficiency +2 (level 2).\nYou roll a d20 and add +5.\nDamage = '+wdie+' + Strength +3.';if(raging&&HEADS[who].cls==='barb')msg+='\nRage +2 extra damage. Not on the d20.';if(reckless&&HEADS[who].cls==='barb')msg+='\nReckless: two d20s, keep higher.';say(msg)}
function whyAC(){say('Armor 13 = 10 + Dex +1 + Con +2. Barbarian Unarmored Defense.')}
function whyInit(){say('Initiative +1 = Dexterity 13.')}
function whySpeed(){say('Speed 40 = ettin speed.')}
function whySize(){say('Size Large = ettin size.')}
function whyVision(){say('Darkvision 60 = ettin trait.')}
function whyPerc(){var w=bodyMod('wis');var p=skillOn.Perception?2:0;say('Passive Perception '+(10+w+p)+' = 10 + Wisdom '+signed(w)+(p?' + proficiency +2':''));}
function whyIns(){var w=bodyMod('wis');say('Passive Insight '+(10+w)+' = 10 + Wisdom '+signed(w)+'. Not trained.')}
function whyHD(){say(HEADS[who].name+' Hit Dice '+HEADS[who].hd+'. Barb d12 / Fighter d10. Heal spends them + Con +2.')}
function doRage(){if(!raging){if(rage<=0){say('No Rage left.');return;}rage-=1;raging=true;say('Rage ON. Left '+rage+'/2. After a hit add +2 damage.');}else{raging=false;say('Rage OFF.');}paintActs();save()}
function doReck(){reckless=!reckless;paintActs();save();say(reckless?'Reckless ON. Two d20s to hit.':'Reckless OFF.')}
function doSW(){if(sw<=0){say('Second Wind already used.');return;}sw-=1;say('Second Wind. Roll 1d10 yourself, add +2 fighter level, tap + on HP.');paintActs();save()}
function doSurge(){if(surge<=0){say('Action Surge already used.');return;}surge-=1;say('Action Surge. One extra Action this turn.');paintActs();save()}
function shortRest(){if(who==='b'){sw=1;surge=1;}raging=false;paintActs();say('Short rest. Fighter uses back.');save()}
function longRest(){var p=cur();p.hp=p.max;p.temp=0;if(who==='o'){rage=2;raging=false;reckless=false;}else{sw=1;surge=1;}paintHP();paintActs();say('Long rest. HP full. Uses back.');save()}
function showHead(w){who=w;var h=HEADS[w];$('btnO').className=w==='o'?'on':'';$('btnB').className=w==='b'?'on':'';$('cname').textContent=h.name;$('csub').textContent=h.sub;$('abs').innerHTML='';[['STR',17,3,5,1,'Strength 17'],['DEX',13,1,1,0,'Dexterity 13'],['CON',15,2,4,1,'Constitution 15'],['INT',h.int,mod(h.int),mod(h.int),0,'Intelligence '+h.int],['WIS',h.wis,mod(h.wis),mod(h.wis),0,'Wisdom '+h.wis],['CHA',h.cha,mod(h.cha),mod(h.cha),0,'Charisma '+h.cha]].forEach(function(a){var d=document.createElement('div');d.className='ab';d.innerHTML='<div>'+a[0]+'</div><div class="mod">'+signed(a[2])+'</div><div class="sc">'+a[1]+'</div><div class="sv'+(a[4]?' p':'')+'">save '+signed(a[3])+'</div>';d.onclick=function(){var msg=a[5]+' = '+signed(a[2])+'.\n';if(a[4])msg+='Save '+signed(a[3])+' = modifier '+signed(a[2])+' + proficiency +2.';else msg+='Save '+signed(a[3])+' = modifier only.';say(msg);};$('abs').appendChild(d);});$('gear').textContent=h.gear;$('story').textContent=h.story;paintHP();paintActs();renderSkills();paintInv();localStorage.setItem('ettinWho',w);save();}
function renderSkills(){var box=$('skills');box.innerHTML='';SKILLS.forEach(function(s){var ab=bodyMod(s[1]);var trained=skillOn[s[0]];var tot=ab+(trained?2:0);var row=document.createElement('div');row.className='sk';row.innerHTML='<span><span class="dot'+(trained?' on':'')+'"></span>'+s[0]+'</span><span class="bonus">'+signed(tot)+'</span>';row.onclick=function(){var msg=s[0]+' total '+signed(tot)+'.\n'+ABNAME[s[1]]+' '+signed(ab)+'.\n';if(trained)msg+='Proficiency +2. '+WHY[s[0]];else msg+='Not trained.';msg+='\nRoll a d20 and add '+signed(tot)+'.';say(msg);};box.appendChild(row);});$('pperc').textContent=10+bodyMod('wis')+(skillOn.Perception?2:0);$('pins').textContent=10+bodyMod('wis')+(skillOn.Insight?2:0)}
function paintInv(){$('gold').textContent=gold}
function chgGold(n){gold=Math.max(0,gold+n);paintInv();save()}
function load(){var s={};try{s=JSON.parse(localStorage.getItem('ettinLegal')||'{}')}catch(e){}if(s.pool){if(s.pool.o)Object.assign(pool.o,s.pool.o);if(s.pool.b)Object.assign(pool.b,s.pool.b);}pool.o.max=23;if(pool.o.hp>23)pool.o.hp=23;pool.b.max=20;if(pool.b.hp>20)pool.b.hp=20;if(s.notes)$('notes').value=s.notes;if(s.gold!=null)gold=s.gold;if(s.rage!=null)rage=s.rage;if(s.sw!=null)sw=s.sw;if(s.surge!=null)surge=s.surge;if(s.raging)raging=s.raging;if(s.reckless)reckless=s.reckless;showHead(localStorage.getItem('ettinWho')||'o')}
function save(){localStorage.setItem('ettinLegal',JSON.stringify({pool:pool,notes:$('notes').value,gold:gold,rage:rage,sw:sw,surge:surge,raging:raging,reckless:reckless}))}
function chgHP(n){var p=cur();if(n<0){var left=-n;if(p.temp>0){var u=Math.min(p.temp,left);p.temp-=u;left-=u;}p.hp=Math.max(0,p.hp-left);}else p.hp=Math.min(p.max,p.hp+n);say(HEADS[who].name+' HP '+p.hp+' / '+p.max+'.');paintHP();save()}
function chgTemp(n){cur().temp=Math.max(0,cur().temp+n);paintHP();save();say('Temp HP '+cur().temp+'.')}
function chgMax(n){var p=cur();p.max=Math.max(1,p.max+n);if(p.hp>p.max)p.hp=p.max;paintHP();save()}
function fullHeal(){var p=cur();p.hp=p.max;p.temp=0;paintHP();save();say(HEADS[who].name+' HP full.')}
$('notes').oninput=save;load();
</script></body></html>
